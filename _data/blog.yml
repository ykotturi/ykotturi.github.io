- title: "Everyday Design Lab Goes to CHI"
  url: /posts/2026/05/the-everyday-design-lab-goes-to-chi-2026/
  image: chi-all-kotturi-lab.jpeg
  alt: "Everyday Design Lab Goes to CHI"
  authors: "Yasmine Kotturi"
  date: "May 27, 2026"
  summary: "The Everyday Design Lab presented two papers at CHI 2026 on student-driven AI policy design and community-centered deployment of BizChat, an AI business-planning tool for small business planning."

- title: "Tokenwise Tracker: Effortless OpenAI Cost Monitoring for Developers"
  url: https://medium.com/@chhayaketul13/tokenwise-tracker-effortless-openai-cost-monitoring-for-developers-98f333a9161d
  image: medium-ketul.png
  alt: "Tokenwise Tracker Blog Post Thumbnail"
  authors: "Ketul Chhaya"
  date: "November 24, 2025"
  summary: "Tokenwise Tracker is an npm package that provides effortless OpenAI cost monitoring for developers. It helps track and manage API usage costs when working with OpenAI's services, making it easier to monitor spending and optimize usage."

- title: "CRA Trustworthy AI Research Fellow Spotlight: Yasmine Kotturi"
  url: https://cra.org/crn/2025/10/cra-trustworthy-ai-research-fellow-spotlight-yasmine-kotturi/
  image: CRN-online-banner.png
  alt: "CRA Trustworthy AI Research Fellow Spotlight"
  authors: "Computing Research Association and Yasmine Kotturi"
  date: "October 2025"
  summary: "As a CRA Trustworthy AI Fellow, I discuss my work building community-centered AI tools like BizChat (an LLM app helping small business owners draft business plans through a feminist makerspace partnership), argue that trustworthy AI should sometimes foster informed refusal rather than just adoption, and emphasize grounding AI design in both human-centered basics and meaningful community participation."

- title: "Creating a Better Online Space for Creative Entrepreneurs: The Story of Peerdea"
  url: https://medium.com/p/1cefd05fbe35
  image: medium-peerdea.png
  alt: "The Story of Peerdea"
  authors: "Yasmine Kotturi"
  date: "October 31, 2024"
  summary: "We built Peerdea, a peer support app for creative entrepreneurs, through a 3.5-year partnership with a Pittsburgh feminist makerspace. Unlike social media, it uses small trusted groups where creators can safely share unfinished work, get feedback, and protect their IP."

- title: "Towards Sustainable Economic Futures with Long-Term Tech Support for Local Businesses"
  url: https://medium.com/acm-cscw/towards-sustainable-economic-futures-with-long-term-tech-support-for-local-businesses-5bd8e6018563
  image: medium-thd.png
  alt: "Sustainable Economic Futures Blog Post Thumbnail"
  authors: "Yasmine Kotturi"
  date: "October 29, 2024"
  summary: "We compare two long-running tech support programs for small businesses in Detroit and Pittsburgh, identifying three keys to sustainability: flexible funding models (volunteers vs. paid local hires), trust-building through ongoing community partnerships, and teaching entrepreneurs to use tools independently rather than just fixing problems for them."
